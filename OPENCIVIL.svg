<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Edificio Principal (Alto) -->
  <path d="M90 30 L160 50 V170 H90 Z" fill="#1F2937" />
  
  <!-- Edificio Secundario (Bajo a la izquierda) -->
  <path d="M40 90 L90 105 V170 H40 Z" fill="#1F2937" />

  <!-- Ventanas Edificio Principal -->
  <!-- Columna 1 -->
  <rect x="105" y="70" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="105" y="100" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="105" y="130" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />

  <!-- Columna 2 -->
  <rect x="130" y="60" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="130" y="90" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="130" y="120" width="12" height="16" rx="2" fill="#60A5FA" stroke="none" />

  <!-- Ventanas Edificio Secundario -->
  <rect x="55" y="115" width="10" height="14" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="70" y="115" width="10" height="14" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="55" y="140" width="10" height="14" rx="2" fill="#60A5FA" stroke="none" />
  <rect x="70" y="140" width="10" height="14" rx="2" fill="#60A5FA" stroke="none" />

  <!-- Puerta Principal -->
  <path d="M115 170 V145 H135 V170" fill="none" stroke="currentColor" stroke-width="6" />

  <!-- Línea de base / Contorno general limpio -->
  <path d="M30 170 H170" stroke="currentColor" stroke-width="6" />
</svg>
